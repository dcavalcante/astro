name: Navigation API review v4

on:
  push:
    branches:
      - review/navigation-api-client-router-final

permissions:
  contents: write

jobs:
  review:
    if: github.event.head_commit.message == 'review navigation api v4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Recreate candidate and apply fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          old_workflow = subprocess.check_output(
              ['git', 'show', '5fc593110adced39601332a859daa0ca8762567d:.github/workflows/navigation-api-review.yml'],
              text=True,
          )
          marker = "          python <<'PY'\n"
          start = old_workflow.index(marker) + len(marker)
          end = old_workflow.index("\n          PY\n", start)
          script = old_workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, 'navigation-api-review-v1.py', 'exec'))

          path = Path('packages/astro/src/transitions/router.ts')
          router = path.read_text()

          old_state = "\t\t\tnavigationApi?.updateCurrentEntry({ state: options.state });"
          new_state = "\t\t\tif (options.state !== undefined) {\n\t\t\t\tnavigationApi?.updateCurrentEntry({ state: options.state });\n\t\t\t}"
          assert old_state in router
          router = router.replace(old_state, new_state, 1)

          old_delegate = """\t\t\t\tif (preparedEvent.defaultPrevented || preparedEvent.to.origin !== location.origin) {
          \t\t\t\t\tbypassNavigationApi = true;
          \t\t\t\t\tlocation.href = preparedEvent.to.href;
          \t\t\t\t\tthrow new DOMException('Delegating navigation to the browser', 'AbortError');
          \t\t\t\t}"""
          new_delegate = """\t\t\t\tif (preparedEvent.defaultPrevented) {
          \t\t\t\t\tbypassNavigationApi = true;
          \t\t\t\t\tlocation.href = to.href;
          \t\t\t\t\tthrow new DOMException('Delegating navigation to the browser', 'AbortError');
          \t\t\t\t}
          \t\t\t\tif (preparedEvent.to.origin !== location.origin) {
          \t\t\t\t\tbypassNavigationApi = true;
          \t\t\t\t\tlocation.href = preparedEvent.to.href;
          \t\t\t\t\tthrow new DOMException('Delegating navigation to the browser', 'AbortError');
          \t\t\t\t}"""
          assert old_delegate in router
          router = router.replace(old_delegate, new_delegate, 1)

          old_entry = """\tindex: number;
          \tkey: string;
          \turl: string;"""
          new_entry = """\tindex: number;
          \tkey: string;
          \tsameDocument: boolean;
          \turl: string;"""
          assert old_entry in router
          router = router.replace(old_entry, new_entry, 1)

          old_listener = "\taddEventListener: (type: 'navigate', listener: (event: NavigateEvent) => void) => void;"
          new_listener = """\taddEventListener: {
          \t\t(type: 'navigate', listener: (event: NavigateEvent) => void): void;
          \t\t(
          \t\t\ttype: 'currententrychange',
          \t\t\tlistener: (event: NavigationCurrentEntryChangeEvent) => void,
          \t\t): void;
          \t};"""
          assert old_listener in router
          router = router.replace(old_listener, new_listener, 1)

          old_event_end = """\tscroll: () => void;
          };
          type AstroNavigationRequest"""
          new_event_end = """\tscroll: () => void;
          };
          type NavigationCurrentEntryChangeEvent = {
          \tfrom: NavigationHistoryEntry;
          \tnavigationType: NavigateEvent['navigationType'] | null;
          };
          type AstroNavigationRequest"""
          assert old_event_end in router
          router = router.replace(old_event_end, new_event_end, 1)

          save_scroll = """function saveNavigationScrollPosition() {
          \tconst entry = navigationApi?.currentEntry;
          \tif (entry && navigationEntries.has(entry.key)) {
          \t\tnavigationScrollPositions.set(entry.key, { scrollX, scrollY });
          \t}
          }"""
          current_entry_change = save_scroll + """

          function onNavigationCurrentEntryChange(event: NavigationCurrentEntryChangeEvent) {
          \tconst currentEntry = navigationApi?.currentEntry;
          \tif (
          \t\tcurrentEntry &&
          \t\t!navigationEntries.has(currentEntry.key) &&
          \t\tnavigationEntries.has(event.from.key) &&
          \t\tcurrentEntry.sameDocument
          \t) {
          \t\ttrackNavigationEntry(currentEntry);
          \t}
          }"""
          assert save_scroll in router
          router = router.replace(save_scroll, current_entry_change, 1)

          old_init_listener = "\t\t\tnavigationApi.addEventListener('navigate', onNavigate);"
          new_init_listener = """\t\t\tnavigationApi.addEventListener('navigate', onNavigate);
          \t\t\tnavigationApi.addEventListener('currententrychange', onNavigationCurrentEntryChange);"""
          assert old_init_listener in router
          router = router.replace(old_init_listener, new_init_listener, 1)

          path.write_text(router)
          PY
          git diff --check

      - name: Build
        run: pnpm run build

      - name: Focused traversal regressions
        run: >-
          pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts
          --project="Chrome Stable" --workers=1 --retries=0
          --grep="Back button is captured|cross-route fragments|Scroll position restored when transitioning back to fragment|Horizontal scroll position restored on back button|View Transitions Rule|Navigation API restores Astro-managed traversal|Navigation API reports traversal direction|Navigation API preserves navigate state|Navigation API runs custom preparation|ClientRouter does not claim external|ClientRouter does not intercept cross-document|falls back to History API when Navigation precommit|body inline scripts"

      - name: Framework router stress
        run: >-
          pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts
          --project="Chrome Stable" --workers=1 --retries=0 --repeat-each=20
          --grep="Use the client side router in framework components"

      - name: Full View Transitions Chrome suite
        run: pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts --project="Chrome Stable" --workers=1 --retries=0

      - name: Check changed source
        run: |
          pnpm exec biome check packages/astro/src/transitions/router.ts packages/astro/src/transitions/events.ts packages/astro/e2e/view-transitions.test.ts
          pnpm run typecheck

      - name: Commit validated source
        run: |
          git config user.name "Daniel Cavalcante"
          git config user.email "dcavalcante@gmail.com"
          git add packages/astro/src/transitions/router.ts packages/astro/e2e/view-transitions.test.ts
          git commit -m "fix(transitions): harden Navigation API routing"
          git push