name: Navigation API review v6

on:
  push:
    branches:
      - review/navigation-api-client-router-final

permissions:
  contents: write

jobs:
  review:
    if: github.event.head_commit.message == 'review navigation api v6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Recreate reviewed candidate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          workflow = subprocess.check_output(
              ['git', 'show', 'b76b73d0cbb023833035fb57acd4c8fd73187773:.github/workflows/navigation-api-review-v3.yml'],
              text=True,
          )
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          )
          exec(compile(script, 'navigation-api-review-v5.py', 'exec'))

          test_path = Path('packages/astro/e2e/view-transitions.test.ts')
          tests = test_path.read_text()
          old = """\t\texpect(animations.length).toEqual(1);

          \t\t// go to page 2"""
          new = """\t\texpect(animations.length).toEqual(1);
          \t\t// Finish the setup animation before checking whether swap() causes a new render.
          \t\tawait page.evaluate(async () => {
          \t\t\tawait Promise.allSettled(document.getAnimations().map((animation) => animation.finished));
          \t\t});

          \t\t// go to page 2"""
          assert old in tests
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests)
          PY
          git diff --check

      - name: Build
        run: pnpm run build

      - name: Focused regressions
        run: >-
          pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts
          --project="Chrome Stable" --workers=1 --retries=0
          --grep="No page rendering during swap|Back button is captured|cross-route fragments|Scroll position restored when transitioning back to fragment|Horizontal scroll position restored on back button|View Transitions Rule|Navigation API restores Astro-managed traversal|Navigation API reports traversal direction|Navigation API preserves navigate state|Navigation API runs custom preparation|ClientRouter does not claim external|ClientRouter does not intercept cross-document|falls back to History API when Navigation precommit|body inline scripts|Use the client side router in framework components"

      - name: Swap rendering stress
        run: >-
          pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts
          --project="Chrome Stable" --workers=1 --retries=0 --repeat-each=20
          --grep="No page rendering during swap"

      - name: Framework router stress
        run: >-
          pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts
          --project="Chrome Stable" --workers=1 --retries=0 --repeat-each=5
          --grep="Use the client side router in framework components"

      - name: Full View Transitions Chrome suite
        run: pnpm -C packages/astro exec playwright test e2e/view-transitions.test.ts --project="Chrome Stable" --workers=1 --retries=0

      - name: Check changed source
        run: |
          pnpm exec biome check packages/astro/src/transitions/router.ts packages/astro/src/transitions/events.ts packages/astro/e2e/view-transitions.test.ts
          pnpm run typecheck

      - name: Commit validated source
        run: |
          git config user.name "Daniel Cavalcante"
          git config user.email "dcavalcante@gmail.com"
          git add packages/astro/src/transitions/router.ts packages/astro/e2e/view-transitions.test.ts
          git commit -m "fix(transitions): harden Navigation API routing"
          git push